<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPB Firestore Test</title>
<style>
body{margin:0;padding:16px;background:#0b1522;color:#e8f0ff;font:15px/1.6 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 12px}
button{background:#1e6fd9;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;margin:4px 4px 4px 0}
button.warn{background:#8a2b2b}
#log{white-space:pre-wrap;background:#102338;border:1px solid #31516f;border-radius:10px;padding:12px;margin-top:12px;min-height:120px;direction:ltr;text-align:left;font:13px/1.5 monospace}
.ok{color:#5df29a}.bad{color:#ff7b7b}
</style>
</head>
<body>
<h1>اختبار اتصال Firestore (بيانات تجريبية فقط)</h1>
<button id="run">ابدأ الاختبار</button>
<button id="clean" class="warn">امسح بيانات الاختبار</button>
<div id="log">جاهز.</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCRK-WkEHOfmxlSIhz4SnZTt2QV-A33gjQ",
  authDomain: "solar-productivity.firebaseapp.com",
  projectId: "solar-productivity",
  storageBucket: "solar-productivity.firebasestorage.app",
  messagingSenderId: "578093863",
  appId: "1:578093863:web:ab87b23d96005b8c0d1f02"
};
const logEl = document.getElementById('log');
function log(m, cls){ const s=document.createElement('div'); if(cls)s.className=cls; s.textContent=m; logEl.appendChild(s); }
const CHUNKS = 12, CELLS_PER_CHUNK = 941; // ≈ 11,292 خلية لعملية واحدة
const base = () => db.collection('dpb').doc('test').collection('grid_Ramming');
let db;

async function init(){
  if(!window.firebase){ throw new Error('مكتبة Firebase مش اتحمّلت (النت أو حظر gstatic).'); }
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  await firebase.auth().signInAnonymously();
  log('✓ تسجيل الدخول المجهول نجح', 'ok');
}

document.getElementById('run').onclick = async () => {
  logEl.textContent = '';
  try{
    await init();

    // 1) كتابة 12 وثيقة (11,292 خلية) في دفعة واحدة
    let t0 = performance.now();
    const batch = db.batch();
    for(let k=0;k<CHUNKS;k++){
      const cells = {};
      for(let i=0;i<CELLS_PER_CHUNK;i++){
        const r = k*40 + Math.floor(i/24), c = i%24;
        cells[r+'|'+c] = { c:1, u:'Ibrahim', t:Date.now() };
      }
      batch.set(base().doc('c'+k), { cells, updatedAt: Date.now() });
    }
    await batch.commit();
    log('✓ كتابة '+CHUNKS+' وثيقة (~'+(CHUNKS*CELLS_PER_CHUNK)+' خلية): '+Math.round(performance.now()-t0)+' ms', 'ok');

    // 2) قراءة كل الوثائق من السيرفر (= أول تحميل للجهاز)
    t0 = performance.now();
    const snap = await base().get({source:'server'});
    let n=0; snap.forEach(d=>{ n += Object.keys(d.data().cells||{}).length; });
    log('✓ قراءة '+snap.size+' وثيقة ('+n+' خلية) = '+snap.size+' قراءة: '+Math.round(performance.now()-t0)+' ms', 'ok');

    // 3) تغيير خلية واحدة وقياس زمن وصول التأكيد من السيرفر
    const ref = base().doc('c0');
    let acked = null; const t1 = performance.now();
    const unsub = ref.onSnapshot({includeMetadataChanges:true}, s=>{
      if(s.metadata.hasPendingWrites===false && acked===null && performance.now()-t1>1){
        acked = Math.round(performance.now()-t1);
      }
    });
    await ref.update({ ['cells.0|0']: { c:1, u:'Test', t:Date.now() }, updatedAt: Date.now() });
    await new Promise(r=>setTimeout(r,1500)); unsub();
    log('✓ تعديل خلية واحدة اتأكد من السيرفر في: '+(acked===null?'؟':acked+' ms')+' (وبيتحسب كتابة واحدة)', 'ok');

    // 4) حذف خلية = حذف حقل من الوثيقة
    await ref.update({ ['cells.0|0']: firebase.firestore.FieldValue.delete() });
    log('✓ حذف خلية (حذف حقل) نجح', 'ok');

    log('\nالنتيجة: Firestore شغال وبيتحمّل الحجم ده. افتح Firebase Console ← Firestore ← Usage وشوف عدّاد القراءات والكتابات.', 'ok');
  }catch(e){
    log('✗ فشل: '+(e.code||'')+' '+(e.message||e), 'bad');
    if(String(e.code||e.message).match(/admin-restricted|operation-not-allowed/i)) log('← فعّل Authentication ← Sign-in method ← Anonymous.', 'bad');
    if(String(e.code||e.message).match(/permission-denied/i)) log('← الصق قواعد الأمان في Firestore ← Rules واضغط Publish.', 'bad');
  }
};

document.getElementById('clean').onclick = async () => {
  try{
    await init();
    const snap = await base().get({source:'server'});
    const batch = db.batch(); snap.forEach(d=>batch.delete(d.ref)); await batch.commit();
    log('✓ اتمسح '+snap.size+' وثيقة اختبار', 'ok');
  }catch(e){ log('✗ '+(e.code||'')+' '+(e.message||e), 'bad'); }
};
</script>
</body>
</html>
