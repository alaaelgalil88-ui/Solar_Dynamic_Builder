name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html sw.js manifest.json icon-192.png icon-512.png dpb-fs.js dpb-fs2-core.js dpb-fs2.js dpb-config.js www/
          ls -la www

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bundle Firebase SDK into www/vendor
        run: |
          sh build-vendor.sh
          test -s www/vendor/firebase-bundle.js

      - name: Install Capacitor
        run: npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/local-notifications @capacitor/push-notifications

      - name: Create Android project
        run: npx cap add android

      - name: Add Firebase config (push)
        run: |
          test -s google-services.json
          cp google-services.json android/app/google-services.json

      - name: Add notification permissions to AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$P" "$M" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Add print plugin
        run: |
          D=android/app/src/main/java/com/dpb/map/v2
          mkdir -p "$D"
          cp android-native/*.java "$D/"

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DPB-Map-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
