name: Build in-app update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'dpb-*.js'
      - 'icon-*.png'
      - 'vendor-src/**'
      - 'update-url.txt'

permissions:
  contents: write

concurrency:
  group: build-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the update package
        run: node build-local.js --ota

      - name: Save it in update/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A update
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "In-app update package [skip ci]"
          git pull --rebase origin main
          git push
